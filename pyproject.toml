[project]
name = "snowflake-well-assistant"
version = "0.1.0"
description = "Oil & Gas Snow Well Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "snowflake-connector-python[secure-local-storage]>=3.12.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.0",
    "snowflake-ml-python>=1.37.0",
    "numba>=0.65.1",
    "scikit-learn>=1.7.2",
    "pandas>=2.3.3",
    "numpy>=2.4.4",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.12",
]
